<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布商品 - 账号商品展示站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="inner">
      <div class="logo">账号商品展示站</div>
      <div class="nav">
        <span class="user-info" id="userInfo"></span>
        <a href="index.html">首页</a>
        <a href="javascript:logout()">退出登录</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="form-card" style="max-width:560px">
      <h1>发布上架</h1>
      <div class="sub">提交后商品为【待审核】状态，管理员审核通过后展示在首页（需求 3/4）</div>

      <div class="alert" id="alert"></div>

      <form id="publishForm">
        <!-- 图片上传：支持多选，最多 5 张，存 Supabase Storage -->
        <div class="form-item">
          <label>上传照片</label>
          <input type="file" id="images" accept="image/*" multiple>
          <div class="hint">可上传 1~5 张图片，展示账号相关截图/照片</div>
          <div class="preview-list" id="preview"></div>
        </div>

        <!-- 账号简介 -->
        <div class="form-item">
          <label>账号简介</label>
          <textarea id="intro" required placeholder="介绍一下你要展示的账号，例如：游戏等级、段位、装备、可交易内容等…" maxlength="500"></textarea>
          <div class="hint" id="introCount">0 / 500</div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%">提交上架</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    // ============================================================
    // 发布页逻辑：
    // ① 登录校验（未登录跳登录页，需求 3）
    // ② 图片上传到 Supabase Storage，获得公开 URL
    // ③ 写入 goods 表，status 默认 pending（待审核）
    // ============================================================
    (async function () {
      // 页面守卫：未登录自动跳登录页
      const user = await requireLogin("login.html");
      if (!user) return;
      document.getElementById("userInfo").textContent = "你好，" + user.username;

      // ---------- 本地图片预览（不上传，仅展示选中效果） ----------
      const fileInput = document.getElementById("images");
      fileInput.addEventListener("change", function () {
        const files = Array.from(fileInput.files).slice(0, 5); // 最多 5 张
        const preview = document.getElementById("preview");
        preview.innerHTML = "";
        files.forEach(function (f) {
          const img = document.createElement("img");
          img.src = URL.createObjectURL(f); // 本地临时 URL
          preview.appendChild(img);
        });
      });

      // ---------- 简介字数统计 ----------
      const introInput = document.getElementById("intro");
      introInput.addEventListener("input", function () {
        document.getElementById("introCount").textContent = introInput.value.length + " / 500";
      });

      // ---------- 提交 ----------
      document.getElementById("publishForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const files = Array.from(fileInput.files).slice(0, 5);
        const intro = introInput.value.trim();
        const btn = document.getElementById("submitBtn");
        const alertBox = document.getElementById("alert");
        alertBox.style.display = "none";

        // 1) 基础校验
        if (!files.length) { showAlert(alertBox, "请至少选择一张图片", "error"); return; }
        if (!intro) { showAlert(alertBox, "请填写账号简介", "error"); return; }

        btn.disabled = true;
        btn.textContent = "提交中…";
        try {
          // 2) 逐张上传图片到 Supabase Storage（目录：uploads/<用户id>/）
          const folder = "uploads/" + user.id;
          const urls = [];
          for (const f of files) {
            const url = await uploadImage(f, folder);
            urls.push(url);
          }

          // 3) 写入商品表：status 默认 pending，等待管理员审核
          const { error } = await supabase
            .from("goods")
            .insert({
              user_id: user.id,
              images: urls,      // text[] 数组，Supabase 会自动转成 Postgres 数组
              intro: intro,
              status: "pending",
            });
          if (error) throw error;

          // 4) 成功提示，回到首页查看（商品需管理员审核后才展示）
          showAlert(alertBox, "提交成功！商品已进入待审核队列，审核通过后将在首页展示", "success");
          document.getElementById("publishForm").reset();
          document.getElementById("preview").innerHTML = "";
          document.getElementById("introCount").textContent = "0 / 500";
          setTimeout(function () { location.href = "index.html"; }, 1500);
        } catch (err) {
          showAlert(alertBox, "提交失败：" + err.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "提交上架";
        }
      });
    })();

    function showAlert(box, msg, type) {
      box.textContent = msg;
      box.className = "alert " + type;
      box.style.display = "block";
    }
  </script>
</body>
</html>
